      - name: Apply score badge patch
        shell: bash
        run: |
          cd kazumi
          git apply --verbose ../score-badge.patch

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: kazumi/pubspec.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '18'

      - name: Flutter pub get
        working-directory: kazumi
        run: flutter pub get

      - name: Build Windows
        working-directory: kazumi
        run: flutter build windows

      - name: Package release
        shell: powershell
        run: Compress-Archive -Path kazumi/build/windows/x64/runner/Release/* -DestinationPath Kazumi_windows_score_badge.zip

      - name: Publish release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete score-badge-build --cleanup-tag --yes || true
          gh release create score-badge-build Kazumi_windows_score_badge.zip --title "Kazumi Windows (cover score badge)" --notes "Automated build of Kazumi 2.4.3 with Bangumi score badge on covers."
